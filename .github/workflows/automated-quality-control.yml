name: Automated Quality Control (against real devices)

on:
  push:
  pull_request:
  schedule:
    - cron: '0 * * * *'  # every hour

jobs:
  automated-qc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated QC script
        env:
          SCREENLY_API_TOKEN: ${{ secrets.SCREENLY_API_TOKEN }}
        run: |
          # Dependabot-triggered runs read from a separate secret store and do
          # not receive SCREENLY_API_TOKEN, so this job talks to no devices and
          # exits 1 on every dependency PR.
          #
          # The skip is limited to runs that were never meant to have the
          # token: pull_request events, and the push event Dependabot fires on
          # its own dependabot/** branch. On the hourly schedule and on pushes
          # by anyone else (including merges to master), an absent token means
          # the secret itself is gone -- so the script runs and fails, rather
          # than reporting a green live-device check that never contacted a
          # device.
          if [ -z "$SCREENLY_API_TOKEN" ] && { [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; }; then
            echo "::notice::SCREENLY_API_TOKEN is not available to this run; skipping the live device check."
            exit 0
          fi
          python -u automated_quality_control.py

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c #v1